include: package:pedantic_mono/analysis_options.yaml

analyzer:
  exclude:
    - "third_party/**"
    - "**/build/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gform.dart"
    - "**/firebase_options*.dart"
    - "*/.github/workflows/flutter_*.yaml"
    - "*/functions/*.js"
    - "analysis_options.yaml"
  errors:
    invalid_annotation_target: ignore
    todo: ignore
    hack: ignore

# Keep the existing opt-in policy for package-specific diagnostics.
plugins:
  nilts:
    version: ^1.0.4
    diagnostics:
      unsafe_null_assertion: false
      unstable_enum_values: false
  riverpod_lint:
    version: ^3.1.9
    diagnostics:
      async_value_nullable_pattern: false
      avoid_build_context_in_providers: false
      avoid_public_notifier_properties: false
      avoid_ref_inside_state_dispose: false
      functional_ref: false
      missing_provider_scope: false
      notifier_build: false
      notifier_extends: false
      only_use_keep_alive_inside_keep_alive: false
      protected_notifier_properties: false
      provider_dependencies: false
      provider_parameters: false
      riverpod_syntax_error: false
      scoped_providers_should_specify_dependencies: false
      unsupported_provider_value: false

# Preserve the current style while updating the SDK and lint package.
linter:
  rules:
    unnecessary_type_name_in_constructor: false
    use_primary_constructors: false
    async_return_with_no_await: false
    simplify_variable_pattern: false
    empty_container_bodies: false
    unnecessary_const_in_enum_constructor: false
