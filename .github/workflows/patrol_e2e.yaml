name: Patrol E2E

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Critical path platform (ignored for local simulator builds)'
        required: true
        default: all
        type: choice
        options: [all, ios, android]
      build_local_simulator:
        description: 'Build an emulator-backed app for a local iOS simulator'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 18 * * 1-5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-critical-path:
    name: iOS critical path
    if: ${{ !inputs.build_local_simulator && inputs.platform != 'android' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Setup config files
        uses: ./.github/actions/setup-config-files
        env:
          DART_DEFINE_JSON: ${{ secrets.DART_DEFINE_JSON }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
      - name: Setup application runtime
        uses: ./.github/actions/setup-application-runtime
      - name: Install E2E tools
        run: |
          dart pub global activate patrol_cli 4.9.0
          dart pub global activate flutterfire_cli 1.4.1
          npm install --global firebase-tools@15.34.2
          npm ci --prefix functions
      - name: Boot iOS simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Start Firebase emulators
        run: |
          firebase emulators:start --project family-wish-list-ad3c7-dev \
            --only auth,firestore,functions,storage > firebase-emulator.log 2>&1 &
          for _ in {1..120}; do
            curl --silent --fail http://127.0.0.1:4000 >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Run iOS critical path
        timeout-minutes: 35
        working-directory: apps/app
        run: |
          set -o pipefail
          printf 'iosBundleId=%s\n' "$(jq -r '.iosBundleId' ../../.github/e2e_dart_defines.json)" > ios/Flutter/Dart-Defines.xcconfig
          patrol test --target patrol_test/critical_flow_test.dart \
            --uninstall --full-isolation \
            --verbose \
            --dart-define-from-file ../../.github/e2e_dart_defines.json \
            --dart-define useFirebaseEmulators=true \
            --dart-define firebaseEmulatorHost=127.0.0.1 \
            2>&1 | tee ../../patrol-ios.log
      - name: Verify persisted critical-path state
        run: >-
          python3 .github/scripts/verify_emulator_state.py
          --verify --output emulator-state-ios.json
      - name: Capture emulator state
        if: always()
        continue-on-error: true
        run: >-
          python3 .github/scripts/verify_emulator_state.py
          --output emulator-state-ios-capture.json
      - name: Capture simulator on failure
        if: failure()
        run: xcrun simctl io booted screenshot ios-failure.png || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-ios-diagnostics
          if-no-files-found: ignore
          path: |
            patrol-ios.log
            firebase-emulator.log
            firebase-debug.log
            firestore-debug.log
            emulator-state-ios*.json
            ios-failure.png
            apps/app/build/ios_results*.xcresult

  android-critical-path:
    name: Android critical path
    if: ${{ !inputs.build_local_simulator && inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup config files
        uses: ./.github/actions/setup-config-files
        env:
          DART_DEFINE_JSON: ${{ secrets.DART_DEFINE_JSON }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
      - name: Setup application runtime
        uses: ./.github/actions/setup-application-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install E2E tools
        run: |
          dart pub global activate patrol_cli 4.9.0
          dart pub global activate flutterfire_cli 1.4.1
          npm install --global firebase-tools@15.34.2
          npm ci --prefix functions
      - name: Prepare debug signing configuration
        # Gradle evaluates the release configuration even for Patrol's debug build.
        # Debug uses its own keystore; this placeholder never signs a release.
        run: |
          printf '%s\n' \
            'storePassword=local-test-only' \
            'keyPassword=local-test-only' \
            'keyAlias=local-test-only' \
            'storeFile=unused-e2e-signing.jks' > apps/app/android/key.properties
      - name: Start Firebase emulators
        run: |
          firebase emulators:start --project family-wish-list-ad3c7-dev \
            --only auth,firestore,functions,storage > firebase-emulator.log 2>&1 &
          for _ in {1..120}; do
            curl --silent --fail http://127.0.0.1:4000 >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Enable and verify KVM acceleration
        # The runner otherwise silently falls back to unaccelerated emulation.
        # https://github.com/ReactiveCircus/android-emulator-runner#running-hardware-accelerated-emulators-on-linux-runners
        # cspell:ignore udevadm
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Run Android critical path
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          ram-size: 2048M
          heap-size: 256M
          force-avd-creation: true
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash .github/scripts/run_android_critical_path.sh
      - name: Capture Android emulator state
        if: always()
        run: >-
          python3 .github/scripts/verify_emulator_state.py
          --output emulator-state-android-capture.json
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-android-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            patrol-android.log
            patrol-android-diagnostics/
            firebase-emulator.log
            firebase-debug.log
            firestore-debug.log
            emulator-state-android.json
            emulator-state-android-capture.json

  ios-local-simulator:
    # cspell:ignore Rsrc iphonesimulator hashlib plistlib DTSDK hexdigest
    name: Build local iOS simulator app
    if: ${{ inputs.build_local_simulator }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Prepare emulator-only environment
        run: |
          for ENV_PATH in packages/infrastructure/firebase/scripts/env packages/infrastructure/revenue_cat/scripts/env; do
            mkdir -p "$ENV_PATH"
            printf '%s\n' \
              'RECPTCHA_SITE_KEY=local-test-only' \
              'REVENUE_CAT_KEY_APPLE_STORE=local-test-only' \
              'REVENUE_CAT_KEY_PLAY_STORE=local-test-only' > "$ENV_PATH/.env"
            cp "$ENV_PATH/.env" "$ENV_PATH/.env.dev"
          done
          printf 'iosBundleId=%s\n' "$(jq -r '.iosBundleId' .github/e2e_dart_defines.json)" > apps/app/ios/Flutter/Dart-Defines.xcconfig
      - name: Setup application runtime
        uses: ./.github/actions/setup-application-runtime
      - name: Build simulator app
        # The Xcode service-file build phase invokes FlutterFire CLI.
        working-directory: apps/app
        run: |
          dart pub global activate flutterfire_cli 1.4.1
          export PATH="$HOME/.pub-cache/bin:$PATH"
          flutter build ios --simulator --debug \
            --dart-define-from-file ../../.github/e2e_dart_defines.json \
            --dart-define=useFirebaseEmulators=true \
            --dart-define=firebaseEmulatorHost=127.0.0.1
      - name: Archive simulator app and provenance
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            apps/app/build/ios/iphonesimulator/Runner.app ios-local-simulator.zip
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import plistlib
          import subprocess

          info = plistlib.loads(Path("apps/app/build/ios/iphonesimulator/Runner.app/Info.plist").read_bytes())
          if info["CFBundleIdentifier"] != "com.yakuran.familyWishList.dev":
              raise SystemExit("Expected the development application bundle ID")
          result = {
              "source_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "bundle_id": info["CFBundleIdentifier"],
              "version": info["CFBundleShortVersionString"],
              "build_number": info["CFBundleVersion"],
              "sdk": info["DTSDKName"],
              "archive_sha256": hashlib.sha256(Path("ios-local-simulator.zip").read_bytes()).hexdigest(),
              "use_firebase_emulators": True,
              "firebase_emulator_host": "127.0.0.1",
          }
          Path("ios-local-simulator.json").write_text(json.dumps(result, indent=2) + "\n")
          PY
      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: ios-local-simulator
          path: |
            ios-local-simulator.zip
            ios-local-simulator.json
          if-no-files-found: error
          retention-days: 3
