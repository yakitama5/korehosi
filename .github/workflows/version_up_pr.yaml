name: Create Version Up Branch and PR

on:
  workflow_dispatch:
    inputs:
      release_type:
        required: true
        type: choice
        description: バージョンアップする対象を指定します。
        options:
          - major
          - minor
          - patch
          - build
        default: "build"

jobs:
  version_up_pr:
    name: ⬆️Version Up Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: 💾Checkout
        uses: actions/checkout@v4

      - name: 🎯Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: 🥤Activate cider
        run: dart pub global activate cider 0.2.10

      - name: ⬆️Bump version
        run: |
          cd apps/app
          cider bump ${{ github.event.inputs.release_type }} --bump-build

      # バージョンを取得
      - name: 🆕Get new version
        run: |
          cd apps/app
          echo "new_version=$(cider version)" >> $GITHUB_ENV

      # Git設定
      - name: 🐈‍⬛Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # バージョンアップの変更をコミット
      - name: 🆕Commit version bump
        run: |
          git add .
          git commit -m "chore: bump version to ${{ env.new_version }}"

      # releaseブランチを作成
      - name: 🆕Create and push release branch
        env: 
          NEW_BRANCH: 'release/v${{ env.new_version }}'
        run: |
          git checkout -b "$NEW_BRANCH"
          git push origin "$NEW_BRANCH"
      # PRを作成
      - name: 🚀Create PR for release
        env: 
          NEW_BRANCH: 'release/v${{ env.new_version }}'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr create --base ${{ github.ref_name }} --head $NEW_BRANCH --title "Release $NEW_BRANCH" --body ""
          
