name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump (none = バージョンアップせずビルドのみ)"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
          - build
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version_up:
    name: ⬆️Version Up (${{ github.event.inputs.bump_type }})
    if: ${{ github.event.inputs.bump_type != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: 💾Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: 🎯Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: 🥤Install Cider
        run: dart pub global activate cider 0.2.10

      - name: ⬆️Bump version
        id: bump
        working-directory: apps/app
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        run: |
          if [ "$BUMP_TYPE" = "build" ]; then
            cider bump build
          else
            cider bump "$BUMP_TYPE" --bump-build
          fi
          echo "version=$(cider version)" >> "$GITHUB_OUTPUT"

      - name: 🔖Commit and tag version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/app/pubspec.yaml
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v$VERSION"

  build_ios:
    name: 🍎Build and Publish for iOS
    needs: version_up
    if: |
      always() &&
      (needs.version_up.result == 'success' || needs.version_up.result == 'skipped') &&
      (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios')
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      IOS_BUNDLE_ID: com.yakuran.familyWishList
    steps:
      - name: 💾Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: 🐍Setup Python and pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/requirements-cd.txt

      - name: 🪄Install FlutterFire and Codemagic CLI tools
        run: |
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          pip install --disable-pip-version-check -r .github/requirements-cd.txt

      - name: ⚙️Setup Config Files
        uses: ./.github/actions/setup-config-files
        env:
          DART_DEFINE_JSON: ${{ secrets.DART_DEFINE_JSON }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}

      - name: ⚙️Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime
        with:
          code-generation: all

      - name: 📦Restore CocoaPods download cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('apps/app/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: ⚙️Setup latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: ✍️Setup iOS code signing with Codemagic CLI
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$IOS_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --project apps/app/ios/Runner.xcodeproj

      - name: 🛠️Build for iOS
        working-directory: apps/app
        run: >-
          flutter build ipa
          --export-options-plist="$HOME/export_options.plist"
          --dart-define-from-file=dart_defines/prod.json

      - name: 🚀Publish to App Store Connect with Codemagic CLI
        run: |
          APP_FILE=$(find apps/app/build/ios/ipa -name "*.ipa" -type f -print -quit)
          if [ -z "$APP_FILE" ]; then
            echo "Error: .ipa file not found"
            exit 1
          fi
          app-store-connect publish --path "$APP_FILE"

  build_android:
    name: 🤖Build and Publish for Android
    needs: version_up
    if: |
      always() &&
      (needs.version_up.result == 'success' || needs.version_up.result == 'skipped') &&
      (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS }}
      ANDROID_KEYSTORE_FILENAME: ${{ vars.ANDROID_KEYSTORE_FILENAME }}
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: 💾Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: ☕Setup Java and Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/app/android/**/*.gradle*
            apps/app/android/**/gradle-wrapper.properties

      - name: 🐍Setup Python and pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/requirements-cd.txt

      - name: 🪄Install Codemagic CLI tools
        run: pip install --disable-pip-version-check -r .github/requirements-cd.txt

      - name: ⚙️Setup Config Files
        uses: ./.github/actions/setup-config-files
        env:
          DART_DEFINE_JSON: ${{ secrets.DART_DEFINE_JSON }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}

      - name: ⚙️Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime
        with:
          code-generation: all

      - name: ✍️Setup Android code signing
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "apps/app/android/app/$ANDROID_KEYSTORE_FILENAME"
          cat > apps/app/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$ANDROID_KEYSTORE_FILENAME
          EOF

      - name: 🛠️Build for Android
        working-directory: apps/app
        run: >-
          flutter build appbundle
          --dart-define-from-file=dart_defines/prod.json

      - name: 📦Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: apps/app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: 🚀Publish to Google Play internal track with Codemagic CLI
        run: >-
          google-play bundles publish
          --bundle apps/app/build/app/outputs/bundle/release/app-release.aab
          --track internal
