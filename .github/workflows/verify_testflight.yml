name: Verify TestFlight Internal

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "アップロード済みビルドを作成したコミットの完全なSHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: TestFlight 内部公開の確認
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配布元コミットの確認
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["RELEASE_SHA"]):
              raise SystemExit("release_sha must be a full commit SHA")
          PY

      - name: 配布元のバージョン情報を取得
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          path: release-source
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-cd.txt

      - name: 検証ツールの準備とテスト
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pip3 install --disable-pip-version-check -r .github/requirements-cd.txt
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: アップロード済みビルドを内部テストへ追加して確認
        env:
          APP_STORE_APPLE_ID: ${{ vars.APP_STORE_APPLE_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          sys.path.insert(0, ".github/scripts")
          from verify_internal_release import AppleApi, verify_ios

          # This recovery path checks store metadata; no binary is rebuilt or uploaded.
          source = Path("release-source")
          pubspec = (source / "apps/app/pubspec.yaml").read_text()
          version = re.search(r"^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$", pubspec, re.M)
          if version is None:
              raise SystemExit("Expected an application version with a build number")
          metadata = {"bundle_id": "com.yakuran.familyWishList",
                      "version": version[1], "build_number": version[2]}
          result = verify_ios(AppleApi(), metadata, app_id=os.environ["APP_STORE_APPLE_ID"])
          result.update({"platform": "ios", "verification_basis": "store_metadata",
                         "source_sha": subprocess.check_output(
                             ["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip(),
                         "verified_at": datetime.now(timezone.utc).isoformat()})
          report = json.dumps(result, indent=2) + "\n"
          (Path(os.environ["RUNNER_TEMP"]) / "internal-release-ios.json").write_text(report)
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### TestFlight internal release verified\n\n```json\n" + report + "```\n")
          PY

      - name: iOS 内部テスト配布の検証結果
        uses: actions/upload-artifact@v7
        with:
          name: internal-release-ios
          path: ${{ runner.temp }}/internal-release-ios.json
          if-no-files-found: error
          retention-days: 7
