name: flutter_app
description: 子供と大人で利用する、家族のための欲しい物リストアプリ
publish_to: "none"
version: 1.1.0+42

environment:
  sdk: ^3.13.7
  flutter: ^3.47.9

resolution: workspace

dependencies:
  adaptive_dialog: ^2.8.4
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.2
  collection: ^1.19.1
  cupertino_icons: ^2.0.0
  device_preview: ^3.0.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_rating_bar: ^4.0.1
  flutter_settings_ui: ^3.1.0
  flutter_slidable: ^4.0.3
  flutter_svg: ^2.3.2
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  gauge_indicator: ^0.6.0
  go_router: ^17.5.0
  hooks_riverpod: ^3.4.3
  image_picker: ^1.2.4
  intl: ^0.20.3
  introduction_screen: ^4.0.0
  lottie: ^3.8.2
  metadata_fetch: ^0.4.2
  nested: ^1.0.0
  package_info_plus: ^10.2.2
  packages_application:
    path: ../../packages/application
  packages_core:
    path: ../../packages/core
  packages_dependency_override:
    path: ../../packages/dependency_override
  packages_designsystem:
    path: ../../packages/designsystem
  packages_domain:
    path: ../../packages/domain
  packages_infra_ui:
    path: ../../packages/infra_ui
  path_provider: ^2.1.6
  pattern_formatter: ^5.0.0
  permission_handler: ^13.0.2
  photo_view: ^0.15.0
  qr_flutter: ^4.1.0
  reactive_cupertino_text_field: ^2.1.2
  reactive_date_time_picker: ^5.0.1
  reactive_flutter_rating_bar: ^2.0.2
  reactive_forms: 18.2.0
  reactive_image_picker: ^8.0.1
  responsive_framework: ^1.5.1
  riverpod_annotation: ^4.0.7
  shimmer: ^3.0.0
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  url_launcher: ^6.3.3
  version: ^3.0.2

dev_dependencies:
  alchemist: ^0.14.1
  build_runner: ^2.16.1
  firebase_auth: ^6.7.1
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  go_router_builder: ^4.5.3
  json_serializable: ^6.15.2
  patrol: ^4.11.0
  pedantic_mono: ^1.38.1
  # reactive_forms_generator: ^8.1.0-beta0
  riverpod_generator: ^4.0.9
  slang_build_runner: ^4.19.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

  # Assets & Fonts
  assets:
    - assets/images/
    - assets/lottie/
  fonts:
    - family: CustomIcons
      fonts:
        - asset: assets/icons/CustomIcons.ttf
    - family: Murecho
      fonts:
        - asset: assets/fonts/Murecho-VariableFont_wght.ttf

# App Icon
flutter_launcher_icons:
  # https://zenn.dev/tsuruo/articles/eae9dbbad8372f#themed-app-icons
  # https://blog.okaryo.io/20221127-support-themed-app-icon-in-flutter-app-for-android-13
  android: true
  ios: true
  image_path: "assets/lancher_icons/AppIcon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/lancher_icons/AppIcon_foreground.png"
  # monochromeIconを作成する場合に以下を指定して一度生成する方法が一番楽かな？
  # `/android/app/src/main/res/**/ic_launcher_foreground.png`を全て`ic_launcher_monochrome.png`にリネーム
  # `android/res/mipmap-anydpi-v26/ic_launcher.xml`にmonochrome分を追加すれば完了
  # adaptive_icon_foreground: "assets/lancher_icons/AppIcon_foreground_monochrome.png"

flutter_gen:
  output: lib/gen
  assets:
    outputs:
      package_parameter_enabled: false

flutter_intl:
  enabled: true

patrol:
  app_name: これほしい！
  android:
    package_name: com.yakuran.family_wish_list.dev
  ios:
    bundle_id: com.yakuran.familyWishList.dev
