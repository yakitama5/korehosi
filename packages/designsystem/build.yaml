targets:
  $default:
    # Slang writes these outputs in a post-process builder.
    sources:
      exclude:
        - lib/i18n/*.g.dart
    builders:
      slang_build_runner:
        options:
          base_locale: ja
          fallback_strategy: base_locale
          input_directory: assets/i18n
          output_directory: lib/i18n
          translate_var: i18n
          input_file_pattern: .i18n.yaml
          namespaces: true
          lazy: false
          format:
            enabled: true

          # Config
          imports:
            - "package:flutter/material.dart"
            - "package:packages_domain/user.dart"
            - "package:packages_domain/item.dart"
            - "package:packages_domain/common.dart"
            - "package:packages_domain/designsystem.dart"
            - "package:packages_application/item.dart"
          contexts:
            AgeGroup:
              generate_enum: false
            ItemOrderKey:
              generate_enum: false
            SortOrder:
              generate_enum: false
            PurchaseStatus:
              generate_enum: false
            ViewLayout:
              generate_enum: false
            ThemeMode:
              generate_enum: false
            ThemeColor:
              generate_enum: false
            UIStyle:
              generate_enum: false
            BusinessExceptionType:
              generate_enum: false
      freezed:
        # https://github.com/dart-lang/build/blob/master/docs/faq.md#how-do-i-avoid-running-builders-on-unnecessary-inputs
        generate_for:
          include:
            - lib/{value_object,**/value_object}/**.dart
            - lib/{entity,**/entity}/**.dart
            - lib/{model,**/model}/**.dart
      # https://github.com/google/json_serializable.dart/tree/master/json_serializable#build-configuration
      json_serializable:
        generate_for:
          include:
            - lib/{value_object,**/value_object}/**.dart
            - lib/{entity,**/entity}/**.dart
            - lib/{model,**/model}/**.dart
        options:
          # field_rename: snake
          # json のデシリアライズ時に発生する Exception を CheckedFromJsonException にまとめる
          checked: true
      riverpod_generator:
        generate_for:
          include:
            - lib/**/*provider.dart
            - lib/**/*repository.dart
            - lib/**/*service.dart
            - lib/**/*usecase.dart
      # https://github.com/dart-lang/source_gen#ignore_for_file
      source_gen:combining_builder:
        options:
          ignore_for_file:
            - type=lint
            - duplicate_ignore
