imageSourceSelect:
  shoot: "Take Photo"
  chooseFromLibrary: "Choose from Library"
confirmDiscardChanges:
  title: "Discard changes?"
  message: "All changes will be lost"
  discard: "Discard"
  notDiscard: "Keep"
permissionMessages:
  photos: "Access to Gallery"
  camera: "Access to Camera"
  pushNotification: "Push Notification"
  permissionLackDialog:
    title: "${permission:String} is not allowed"
    message: "Please open settings and allow ${permission:String}"
    openSettings: "Open Settings"
  permissionOffDialog:
    title: "Turn off ${permission:String}?"
    message: "Please open settings and turn off ${permission:String}"
    openSettings: "Open Settings"
sendUrlErrorDialog:
  title: "Error"
  message: >-
    Could not open URL.

    Please contact us if this happens frequently.
appUpdate:
  updatePossible:
    message: >-
      A new version is available.
      Update to access new features.
      Do you want to update?
  forceUpdate:
    message: >-
      Your current version is no longer supported.
      Please update from the store.
  navigateStore: "Open Store"
validationError:
  required: "Please enter required items"
  url: "Please enter a valid URL"
format:
  percent: "${percent:String}%"
